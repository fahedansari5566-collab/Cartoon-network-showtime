<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000"/>
    </filter>
  </defs>
  <!-- Black Square 'C' -->
  <rect x="10" y="10" width="60" height="60" rx="8" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
  <text x="40" y="55" font-family="'Titan One', 'Impact', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">C</text>
  
  <!-- White Square 'N' -->
  <rect x="75" y="10" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="105" y="55" font-family="'Titan One', 'Impact', sans-serif" font-size="48" font-weight="900" fill="#000000" text-anchor="middle">N</text>
  
  <!-- Cartoon Network Text Banner -->
  <rect x="145" y="18" width="205" height="44" rx="8" fill="#FFDF00" stroke="#000000" stroke-width="3" filter="url(#shadow)"/>
  <text x="247" y="45" font-family="'Titan One', 'Impact', sans-serif" font-size="19" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">CARTOON NETWORK</text>
</svg>
